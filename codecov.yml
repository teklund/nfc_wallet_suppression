codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 60%
        informational: true

ignore:
  # Generated code, such as pigeon's messages.g.dart, Messages.g.kt and Messages.g.swift.
  - "**/*.g.*"
  - "**/*.freezed.dart"
  - "example/**"
  - "test/**"
  - "pigeons/**"

flags:
  dart:
    paths:
      - lib/
    carryforward: true
  android:
    paths:
      - android/src/main/
    carryforward: true
  ios:
    paths:
      - ios/nfc_wallet_suppression/Sources/
    carryforward: true
