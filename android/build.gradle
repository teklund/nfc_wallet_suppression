group = "dev.teklund.nfc_wallet_suppression"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "jacoco"

// Built-in Kotlin migration (Flutter 3.44+): from AGP 9 onward Kotlin support can be
// provided by AGP itself, in which case applying the Kotlin Gradle Plugin here would
// fail the build. But AGP 9 alone is not enough — built-in Kotlin is only active when
// `android.builtInKotlin` is unset or true, and Flutter's own migrator writes
// `android.builtInKotlin=false` into consumer projects. Whenever it is off we must
// apply KGP ourselves, including on AGP 9.
// The condition mirrors FlutterPluginUtils.isBuiltInKotlinEnabled.
//
// KGP is applied programmatically on purpose. Flutter detects KGP-applying plugins by
// statically grepping this file for a literal `apply plugin: "kotlin-android"` line; a
// match warns consumers that our plugin is Built-in-Kotlin-incompatible and will stop
// building in a future Flutter release, even though the conditional above is correct.
// pluginManager.apply is the same call Flutter itself makes as its fallback, and it is
// idempotent, so both of us applying it is harmless.
//
// See https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlinProp = project.findProperty("android.builtInKotlin")
def builtInKotlin = agpMajor >= 9 &&
    (builtInKotlinProp == null || builtInKotlinProp.toString().toBoolean())
if (!builtInKotlin) {
    pluginManager.apply("kotlin-android")
}

android {
    namespace = "dev.teklund.nfc_wallet_suppression"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test-junit5:$kotlin_version")
        testImplementation("org.mockito:mockito-core:5.14.2")
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
            
            // Enable JaCoCo code coverage
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
    }
    
}

// Built-in Kotlin: configure the JVM target via the modern compilerOptions DSL
// (replaces the deprecated android.kotlinOptions block). Works whether KGP is
// applied (older AGP) or provided by AGP (Built-in Kotlin, AGP 9+).
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

// JaCoCo configuration for test coverage
jacoco {
    toolVersion = "0.8.12"
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    
    reports {
        xml.required = true
        html.required = true
        xml.outputLocation.set(layout.buildDirectory.file("reports/jacoco/test/jacocoTestReport.xml"))
        html.outputLocation.set(layout.buildDirectory.dir("reports/jacoco/test/html"))
    }
    
    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        '**/*Fake*.*',
        'android/**/*.*'
    ]
    
    // Take the class directory from the Kotlin compile task itself rather than
    // hardcoding a path. AGP moved the output under Built-in Kotlin (AGP 9+) from
    // `tmp/kotlin-classes/debug` to an `intermediates/built_in_kotlinc/...` directory;
    // a hardcoded path silently yields an empty report and a green build.
    def debugClasses = tasks.named("compileDebugKotlin").map { it.destinationDirectory }

    def mainSrc = "${project.projectDir}/src/main/kotlin"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(
        files(debugClasses).asFileTree.matching { exclude fileFilter }
    )
    executionData.setFrom(fileTree(
        dir: buildDir,
        includes: [
            'jacoco/testDebugUnitTest.exec',
            'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'
        ]
    ))
}
